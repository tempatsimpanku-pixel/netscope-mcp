name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
        run: npx vitest run

      # Coverage is collected once (needs @vitest/coverage-v8 in devDependencies).
      - name: Test with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  pack:
    name: npm pack (tarball contents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fail if the tarball would contain tests, docs/internal, env files, etc.
      - name: Inspect tarball
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json","utf8"))[0].files.map(f => f.path);
            console.log(files.join("\n"));
            const bad = files.filter(p => /^(test|tests|docs\/internal|\.github|\.env|credentials|data)\b|\.sqlite$|\.pem$|\.key$/.test(p));
            if (bad.length) { console.error("Unexpected files in tarball:", bad); process.exit(1); }
          '

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, pack]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1;; esac
