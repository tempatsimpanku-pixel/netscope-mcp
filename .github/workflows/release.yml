name: Release

# Push a tag like v0.1.0 (from main) to publish.
# Requires npm Trusted Publishing configured for this repo + workflow file
# (npmjs.com -> package -> Settings -> Trusted Publisher: workflow "release.yml",
# environment "npm-publish"). No NPM_TOKEN secret is used.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package.json and is on main
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "Tag $TAG != package.json $PKG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:server-json
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build
      - name: Pack tarball
        run: npm pack --pack-destination dist-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: dist-pack/*.tgz
          if-no-files-found: error

  publish:
    name: npm publish (OIDC, provenance)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish   # add required reviewers in repo settings
    permissions:
      contents: read
      id-token: write          # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'          # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAGOPT=()
          [ "$PRERELEASE" = "true" ] && TAGOPT=(--tag next)
          npm publish --provenance --access public "${TAGOPT[@]}"

  github-release:
    name: SBOM and GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate CycloneDX SBOM (production dependencies)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --ignore-npm-errors --output-format JSON --output-file sbom.cdx.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: dist-pack
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "Empty release notes for $VERSION"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA=()
          [ "$PRERELEASE" = "true" ] && EXTRA=(--prerelease)
          sha256sum dist-pack/*.tgz sbom.cdx.json > SHA256SUMS.txt
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag "${EXTRA[@]}" \
            dist-pack/*.tgz sbom.cdx.json SHA256SUMS.txt
